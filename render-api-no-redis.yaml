# Render Blueprint — always-on API, no Redis (~$7/mo Render hosting)
# For ~15-day product demo: API stays warm; Redis removed (in-memory SSE).
# Web stays on Vercel. Docs: docs/DEMO_DEPLOYMENT.md
#
# ~Cost: API starter ~$7 + Postgres free $0 (expires 30d) ≈ $7/mo
# Cancel API after 15 days in Render dashboard to stop billing.

services:
  - type: web
    name: architectai-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @architectai/shared build &&
      pnpm --filter @architectai/config build &&
      pnpm --filter @architectai/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      - key: LLM_PROVIDER
        value: anthropic
      - key: VERIFICATION_ENABLED
        value: "true"
      - key: VERIFICATION_TIER2_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: architectai-db
          property: connectionString
      # No Redis bill — API falls back to in-memory SSE/rate limits
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WS_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: LLM_MODEL_INTERROGATION
        sync: false
      - key: LLM_MODEL_GENERATION
        sync: false
      - key: LLM_MODEL_ASSIST
        sync: false
      - key: LLM_SESSION_MAX_OUTPUT_TOKENS
        value: "50000"

databases:
  - name: architectai-db
    plan: free
    databaseName: architectai
    user: architectai
