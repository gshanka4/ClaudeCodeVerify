# Render Blueprint — API + Postgres + Redis only (web stays on Vercel)
# Docs: docs/BACKEND_DEPLOYMENT.md

services:
  - type: web
    name: architectai-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @architectai/shared build &&
      pnpm --filter @architectai/config build &&
      pnpm --filter @architectai/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      - key: LLM_PROVIDER
        value: anthropic
      - key: VERIFICATION_ENABLED
        value: "true"
      - key: VERIFICATION_TIER2_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: architectai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: architectai-redis
          type: keyvalue
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WS_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: LLM_MODEL_INTERROGATION
        sync: false
      - key: LLM_MODEL_GENERATION
        sync: false
      - key: LLM_MODEL_ASSIST
        sync: false
      - key: LLM_SESSION_MAX_OUTPUT_TOKENS
        value: "50000"

  - type: keyvalue
    name: architectai-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: architectai-db
    plan: starter
    databaseName: architectai
    user: architectai
