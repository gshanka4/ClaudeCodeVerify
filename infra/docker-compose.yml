name: architectai-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: architectai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-architectai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-architectai}
      POSTGRES_DB: ${POSTGRES_DB:-architectai}
    # Host port is configurable to avoid clashes (P0-EC-03).
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - architectai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-architectai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: architectai-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - architectai-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  architectai-pgdata:
  architectai-redisdata:
