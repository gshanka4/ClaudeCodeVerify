# Render Blueprint — DEMO / product review (~$0/mo on Render)
# Web stays on Vercel (free). No Redis (API uses in-memory SSE fallback).
# Docs: docs/DEMO_DEPLOYMENT.md
#
# Trade-offs: API cold start ~30–60s after idle; Postgres free expires in 30 days;
# generation/verification SSE works on single instance only (no Redis).

services:
  - type: web
    name: architectai-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @architectai/shared build &&
      pnpm --filter @architectai/config build &&
      pnpm --filter @architectai/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      - key: LLM_PROVIDER
        value: anthropic
      - key: VERIFICATION_ENABLED
        value: "true"
      - key: VERIFICATION_TIER2_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: architectai-db
          property: connectionString
      # No Redis service — placeholder URL; API falls back to in-memory hubs
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WS_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: LLM_MODEL_INTERROGATION
        sync: false
      - key: LLM_MODEL_GENERATION
        sync: false
      - key: LLM_MODEL_ASSIST
        sync: false
      - key: LLM_SESSION_MAX_OUTPUT_TOKENS
        value: "50000"

databases:
  - name: architectai-db
    plan: free
    databaseName: architectai
    user: architectai
